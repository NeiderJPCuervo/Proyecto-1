# Levanta todo con:  docker compose up -d
# Luego abre http://localhost en el navegador.
services:
  api:
    image: python:3.12-alpine
    working_dir: /app
    command: python app.py
    environment:
      API_DB: /datos/lecturas.db
      API_KEY: ${API_KEY:-}
    volumes:
      - ./servidor:/app:ro
      - lecturas:/datos
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/sitio.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lecturas:
