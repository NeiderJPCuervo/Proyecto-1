# Nginx hace dos trabajos:
#   1. Sirve los archivos de la página (HTML, CSS, JS) desde la carpeta web/.
#   2. Reenvía (proxy inverso) todo lo que empieza por /api/ al servidor Python.
#
# Con Docker Compose este archivo ya funciona tal cual.
# Instalación manual en Linux: cópialo a /etc/nginx/conf.d/sitio.conf, cambia `root`
# por la ruta real de tu carpeta web/ y `api:5000` por `127.0.0.1:5000`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
    }
}
