<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Sensores</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Monitor de Sensores</h1>
    <p>Datos enviados por la placa con MicroPython · servidos con Nginx</p>
    <span id="estado" class="estado">Conectando…</span>
  </header>

  <main>
    <section class="tarjetas">
      <article class="tarjeta">
        <h2>Temperatura</h2>
        <p class="valor"><span id="temp-actual">--</span> °C</p>
      </article>
      <article class="tarjeta">
        <h2>Humedad</h2>
        <p class="valor"><span id="hum-actual">--</span> %</p>
      </article>
      <article class="tarjeta">
        <h2>Última lectura</h2>
        <p class="valor pequeno" id="ultima">--</p>
      </article>
    </section>

    <section class="panel">
      <h2>Temperatura en el tiempo</h2>
      <canvas id="grafica" height="220"></canvas>
    </section>

    <section class="panel">
      <h2>Enviar un dato manualmente</h2>
      <form id="formulario">
        <label>Dispositivo <input name="dispositivo" value="navegador" required maxlength="50"></label>
        <label>Temperatura (°C) <input name="temperatura" type="number" step="0.1" min="-50" max="150" required></label>
        <label>Humedad (%) <input name="humedad" type="number" step="0.1" min="0" max="100"></label>
        <button type="submit">Enviar</button>
      </form>
      <p id="mensaje" role="status"></p>
    </section>

    <section class="panel">
      <h2>Últimas lecturas</h2>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr><th>#</th><th>Dispositivo</th><th>Temp. (°C)</th><th>Humedad (%)</th><th>Recibido</th></tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
