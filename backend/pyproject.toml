[project]
name = "veedor-secop"
version = "0.1.0"
description = "Vigilancia ciudadana de la contratación pública colombiana (SECOP II) con banderas rojas automáticas."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",   # cliente HTTP para consumir la API de datos.gov.co
    "pandas>=2.2",   # análisis exploratorio de los datos
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",   # pruebas automáticas
    "ruff>=0.6",     # linter + formateador (estilo de código consistente)
]

[tool.pytest.ini_options]
# Permite hacer `from scripts.explorar_secop import ...` dentro de los tests.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, UP: sintaxis moderna, B: bugs comunes
select = ["E", "F", "I", "UP", "B"]
